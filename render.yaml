services:
  - type: web
    name: razorpay-revenue-recovery-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev overrides NODE_ENV=production for this install step.
    # Without it, npm prunes devDependencies under NODE_ENV=production —
    # confirmed directly (`npm install --dry-run` under that env removes
    # typescript) — which is exactly where typescript/tsx/@types/node
    # live, and tsc has nothing left to compile against. NODE_ENV=production
    # still applies at runtime (npm start), which is the only place this
    # app's own isProduction check reads it.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      # Makes auth fail closed — see backend/src/webhooks/auth.ts.
      - key: NODE_ENV
        value: production
      # Required: gates POST /webhooks/synthetic and POST /internal/sweep.
      - key: INGEST_API_KEY
        generateValue: true
      - key: WEBHOOK_RATE_LIMIT_PER_MIN
        value: 120
      - key: SERVICE_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
